<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Plateforme de Cours</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; font-family: system-ui, -apple-system, sans-serif;
         background: #0f0f1a; color: #fff; overflow: hidden; }
  #sidebar { width: 380px; background: #1a1a2e; display: flex; flex-direction: column;
             border-right: 1px solid #222; flex-shrink: 0; }
  #sidebar-header { padding: 18px 20px; border-bottom: 1px solid #222; display: flex;
                    justify-content: space-between; align-items: center; }
  #sidebar-header h2 { color: #e94560; font-size: 18px; }
  #user-info { font-size: 11px; color: #666; }
  #logout { font-size: 11px; color: #e94560; cursor: pointer; background: none;
            border: none; padding: 4px 8px; }
  .tabs { display: flex; border-bottom: 1px solid #222; }
  .tab { flex: 1; padding: 12px 6px; text-align: center; cursor: pointer;
         font-size: 12px; color: #888; transition: all 0.2s; }
  .tab:hover { color: #ccc; }
  .tab.active { color: #fff; background: #16213e; border-bottom: 2px solid #e94560; }
  #content { flex: 1; overflow-y: auto; padding: 8px; }
  .folder { padding: 10px 14px 4px; color: #666; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; }
  .lesson { padding: 11px 14px; cursor: pointer; font-size: 13px; border-radius: 6px;
            margin: 2px 0; display: flex; flex-direction: column; gap: 4px;
            transition: background 0.15s; }
  .lesson:hover { background: #16213e; }
  .lesson.active { background: #e94560; }
  .lesson .title-row { display: flex; justify-content: space-between;
                       align-items: center; gap: 8px; }
  .lesson .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson .cc-badge { font-size: 9px; background: #4ade80; color: #000;
                      padding: 1px 5px; border-radius: 3px; font-weight: 600; }
  .lesson .actions { font-size: 14px; opacity: 0.5; cursor: pointer; padding: 2px 6px;
                     border-radius: 3px; }
  .lesson .actions:hover { opacity: 1; background: rgba(255,255,255,0.1); }
  .lesson .bar { height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
  .lesson .bar > div { height: 100%; background: #4ade80; transition: width 0.3s; }
  .lesson .meta { font-size: 10px; color: #888; }
  .empty { padding: 30px 20px; color: #666; font-size: 13px; text-align: center; }
  #main { flex: 1; display: flex; flex-direction: column; background: #000; min-width: 0; }
  #player-wrap { flex: 1; position: relative; display: flex;
                 align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; background: #000; outline: none; }
  video::cue { background: rgba(0,0,0,0.75); color: #fff;
               font-size: 22px; font-family: system-ui, sans-serif;
               line-height: 1.4; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
  #resume-toast { position: absolute; bottom: 20px; left: 20px;
                  background: rgba(233,69,96,0.95); padding: 10px 16px;
                  border-radius: 6px; font-size: 13px; display: none; }
  #info { padding: 12px 20px; background: #1a1a2e; font-size: 13px; color: #aaa;
          display: flex; justify-content: space-between; align-items: center;
          gap: 12px; position: relative; }
  #info-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #info-actions { display: flex; gap: 8px; align-items: center; }
  .btn { padding: 6px 12px; background: #333; color: #fff; border: none;
         border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .btn:hover { background: #e94560; }
  #subtitle-menu { position: absolute; bottom: 100%; right: 20px;
                   background: #1a1a2e; border: 1px solid #333;
                   border-radius: 6px; padding: 6px; min-width: 200px;
                   display: none; z-index: 10; max-height: 300px; overflow-y: auto; }
  #subtitle-menu.open { display: block; }
  #subtitle-menu .item { padding: 8px 12px; font-size: 13px; cursor: pointer;
                         border-radius: 4px; color: #ccc; }
  #subtitle-menu .item:hover { background: #16213e; color: #fff; }
  #subtitle-menu .item.selected { background: #e94560; color: #fff; }
  #subtitle-menu .header { padding: 6px 12px; font-size: 11px; color: #666;
                           text-transform: uppercase; letter-spacing: 1px; }
  #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85);
                   display: flex; align-items: center; justify-content: center; z-index: 100; }
  #login-box { background: #1a1a2e; padding: 30px; border-radius: 10px;
               width: 320px; border: 1px solid #333; }
  #login-box h2 { color: #e94560; margin-bottom: 20px; text-align: center; }
  #login-box input { width: 100%; padding: 10px; margin: 6px 0; background: #0f0f1a;
                     border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 14px; }
  #login-box button { width: 100%; padding: 10px; margin-top: 12px;
                      background: #e94560; border: none; border-radius: 4px;
                      color: #fff; cursor: pointer; font-size: 14px; }
  #login-box button:hover { background: #c73650; }
  #login-error { color: #e94560; font-size: 12px; margin-top: 8px;
                 text-align: center; min-height: 16px; }
</style>
</head>
<body>

<div id="login-overlay" style="display:none;">
  <div id="login-box">
    <h2>📚 Ma Plateforme</h2>
    <input type="text" id="login-username" placeholder="Nom d'utilisateur" autocomplete="username">
    <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="login-btn">Se connecter / S'inscrire</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>📚 Ma Plateforme</h2>
    <div style="text-align:right;">
      <div id="user-info"></div>
      <button id="logout">Déconnexion</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="all">Tous</div>
    <div class="tab" data-tab="progress">En cours</div>
    <div class="tab" data-tab="archived">Archivés</div>
  </div>
  <div id="content"></div>
</div>

<div id="main">
  <div id="player-wrap">
    <video id="player" controls preload="metadata" crossorigin="anonymous"></video>
    <div id="resume-toast">Reprise…</div>
  </div>
  <div id="info">
    <span id="info-text">Sélectionnez une leçon</span>
    <div id="info-actions">
      <button class="btn" id="subtitle-btn" style="display:none;">💬 Sous-titres</button>
      <button class="btn" id="archive-btn" style="display:none;">Archiver</button>
    </div>
    <div id="subtitle-menu"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let currentVideo = null;
let currentSubtitles = [];
let currentVideoPath = null;
let saveTimer = null;
let currentTab = 'all';
let currentArchived = false;

const player = document.getElementById('player');
const content = document.getElementById('content');
const infoText = document.getElementById('info-text');
const archiveBtn = document.getElementById('archive-btn');
const subtitleBtn = document.getElementById('subtitle-btn');
const subtitleMenu = document.getElementById('subtitle-menu');
const resumeToast = document.getElementById('resume-toast');

function showLogin() { document.getElementById('login-overlay').style.display = 'flex'; }

document.getElementById('login-btn').onclick = async () => {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!u || !p) { err.textContent = 'Remplissez les deux champs'; return; }
  let r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: u, password: p })
  });
  if (!r.ok) {
    r = await fetch('/api/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
  }
  if (!r.ok) { err.textContent = 'Erreur de connexion'; return; }
  const data = await r.json();
  token = data.token;
  username = data.username;
  localStorage.setItem('token', token);
  localStorage.setItem('username', username);
  document.getElementById('login-overlay').style.display = 'none';
  init();
};

document.getElementById('logout').onclick = () => {
  saveProgress();
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  location.reload();
};

async function init() {
  if (!token) { showLogin(); return; }
  document.getElementById('user-info').textContent = username || '';
  loadTab('all');
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => loadTab(t.dataset.tab);
});

async function loadTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === tab));
  content.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    if (tab === 'all') {
      const r = await fetch('/api/courses', { headers: { Authorization: 'Bearer ' + token } });
      const data = await r.json();
      content.innerHTML = '';
      if (!data.length) {
        content.innerHTML = '<div class="empty">Aucun cours trouvé.<br>Vérifiez le montage Yandex.</div>';
        return;
      }
      renderTree(data, content);
    } else if (tab === 'progress') {
      const r = await fetch('/api/in-progress', { headers: { Authorization: 'Bearer ' + token } });
      const rows = await r.json();
      content.innerHTML = '';
      if (!rows.length) { content.innerHTML = '<div class="empty">Aucun cours en cours.</div>'; return; }
      rows.forEach(row => content.appendChild(renderProgressRow(row, false)));
    } else if (tab === 'archived') {
      const r = await fetch('/api/archived', { headers: { Authorization: 'Bearer ' + token } });
      const rows = await r.json();
      content.innerHTML = '';
      if (!rows.length) { content.innerHTML = '<div class="empty">Aucun cours archivé.</div>'; return; }
      rows.forEach(row => content.appendChild(renderProgressRow(row, true)));
    }
  } catch (e) {
    content.innerHTML = '<div class="empty">Erreur de chargement</div>';
    console.error(e);
  }
}

function renderTree(items, container) {
  for (const item of items) {
    if (item.type === 'folder') {
      const f = document.createElement('div');
      f.className = 'folder';
      f.textContent = '📁 ' + item.name;
      container.appendChild(f);
      renderTree(item.children, container);
    } else {
      const el = document.createElement('div');
      el.className = 'lesson';
      el.dataset.path = item.path;
      const ccBadge = item.subtitles && item.subtitles.length
        ? `<span class="cc-badge">CC ${item.subtitles.length}</span>` : '';
      el.innerHTML = `<div class="title-row"><span class="name">▶ ${escapeHtml(item.name)}</span>${ccBadge}</div>`;
      el.onclick = () => playVideo(item);
      container.appendChild(el);
    }
  }
}

function renderProgressRow(row, archived) {
  const name = row.video_path.split('/').pop();
  const el = document.createElement('div');
  el.className = 'lesson';
  el.dataset.path = row.video_path;
  el.innerHTML = `
    <div class="title-row">
      <span class="name">${archived ? '📦' : '▶'} ${escapeHtml(name)}</span>
      <span class="actions" title="${archived ? 'Désarchiver' : 'Archiver'}">${archived ? '↩' : '📦'}</span>
    </div>
    <div class="bar"><div style="width:${row.percent}%"></div></div>
    <div class="meta">${row.percent}% — ${formatTime(row.position)} / ${formatTime(row.duration)}</div>
  `;
  el.querySelector('.title-row').onclick = async () => {
    const fakeItem = { path: row.video_path, name: name, subtitles: [] };
    playVideo(fakeItem);
  };
  el.querySelector('.actions').onclick = async (e) => {
    e.stopPropagation();
    await toggleArchive(row.video_path, !archived);
    loadTab(currentTab);
  };
  return el;
}

async function toggleArchive(videoPath, archive) {
  await fetch('/api/archive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ video_path: videoPath, archived: archive })
  });
}

async function playVideo(item) {
  const videoPath = item.path;
  const displayName = item.name;
  currentVideo = videoPath;
  currentVideoPath = videoPath;
  currentSubtitles = item.subtitles || [];

  document.querySelectorAll('.lesson').forEach(e => e.classList.remove('active'));
  document.querySelectorAll(`.lesson[data-path="${cssEscape(videoPath)}"]`).forEach(e => e.classList.add('active'));

  infoText.textContent = '⏳ Chargement…';
  resumeToast.style.display = 'none';
  archiveBtn.style.display = 'none';
  subtitleBtn.style.display = 'none';
  subtitleMenu.classList.remove('open');

  let progress = { position: 0, duration: 0, archived: 0 };
  try {
    const r = await fetch('/api/progress/' + encodeURIComponent(videoPath), {
      headers: { Authorization: 'Bearer ' + token }
    });
    progress = await r.json();
  } catch (e) { console.error(e); }

  currentArchived = !!progress.archived;

  player.querySelectorAll('track').forEach(t => t.remove());
  player.src = '';
  player.load();

  currentSubtitles.forEach((sub, idx) => {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = formatLangLabel(sub.lang);
    track.srclang = sub.lang === 'default' ? 'fr' : sub.lang.slice(0, 3);
    track.src = '/api/subtitle/' + encodeURIComponent(sub.path) + '?token=' + encodeURIComponent(token);
    if (idx === 0) track.default = true;
    player.appendChild(track);
  });

  player.src = '/api/stream/' + encodeURIComponent(videoPath) + '?token=' + encodeURIComponent(token);
  player.load();

  player.onloadedmetadata = () => {
    if (progress.position > 5 && progress.position < player.duration - 5) {
      player.currentTime = progress.position;
      resumeToast.textContent = '⏪ Reprise à ' + formatTime(progress.position);
      resumeToast.style.display = 'block';
      setTimeout(() => resumeToast.style.display = 'none', 3000);
    }
    infoText.textContent = displayName + ' — ' + formatTime(player.duration);
    archiveBtn.style.display = 'inline-block';
    updateArchiveBtn();
    if (currentSubtitles.length > 0) {
      subtitleBtn.style.display = 'inline-block';
      buildSubtitleMenu();
      const savedLang = localStorage.getItem('subtitle_' + videoPath);
      if (savedLang === 'off') {
        setSubtitleMode('off');
      } else if (savedLang) {
        const idx = currentSubtitles.findIndex(s => s.lang === savedLang);
        if (idx >= 0) enableTrack(idx);
      } else {
        enableTrack(0);
      }
    }
  };

  player.onerror = () => { infoText.textContent = '❌ Erreur de lecture : ' + displayName; };
  player.play().catch(() => {});

  if (saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(() => saveProgress(), 10000);
}

function formatLangLabel(lang) {
  if (lang === 'default') return 'Par défaut';
  const labels = {
    fr: 'Français', en: 'Anglais', es: 'Espagnol', de: 'Allemand',
    it: 'Italien', pt: 'Portugais', ru: 'Russe', ar: 'Arabe',
    zh: 'Chinois', ja: 'Japonais', ko: 'Coréen'
  };
  return labels[lang] || lang.toUpperCase();
}

function enableTrack(idx) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) {
    tracks[i].mode = (i === idx) ? 'showing' : 'disabled';
  }
  const lang = currentSubtitles[idx] ? currentSubtitles[idx].lang : 'default';
  localStorage.setItem('subtitle_' + currentVideoPath, lang);
  updateSubtitleMenuSelection(idx);
}

function setSubtitleMode(mode) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'disabled';
  if (mode === 'off') {
    localStorage.setItem('subtitle_' + currentVideoPath, 'off');
    updateSubtitleMenuSelection(-1);
  }
}

function buildSubtitleMenu() {
  subtitleMenu.innerHTML = '<div class="header">Sous-titres</div>';
  currentSubtitles.forEach((sub, idx) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.dataset.idx = idx;
    item.textContent = formatLangLabel(sub.lang);
    item.onclick = () => { enableTrack(idx); subtitleMenu.classList.remove('open'); };
    subtitleMenu.appendChild(item);
  });
  const offItem = document.createElement('div');
  offItem.className = 'item';
  offItem.dataset.idx = '-1';
  offItem.textContent = '❌ Désactivés';
  offItem.onclick = () => { setSubtitleMode('off'); subtitleMenu.classList.remove('open'); };
  subtitleMenu.appendChild(offItem);
}

function updateSubtitleMenuSelection(idx) {
  subtitleMenu.querySelectorAll('.item').forEach(item => {
    item.classList.toggle('selected', parseInt(item.dataset.idx) === idx);
  });
}

subtitleBtn.onclick = (e) => { e.stopPropagation(); subtitleMenu.classList.toggle('open'); };
document.addEventListener('click', (e) => {
  if (!subtitleMenu.contains(e.target) && e.target !== subtitleBtn) subtitleMenu.classList.remove('open');
});

function updateArchiveBtn() {
  archiveBtn.textContent = currentArchived ? 'Désarchiver' : 'Archiver';
  archiveBtn.onclick = async () => {
    await toggleArchive(currentVideo, !currentArchived);
    currentArchived = !currentArchived;
    updateArchiveBtn();
  };
}

async function saveProgress(useBeacon = false) {
  if (!currentVideo || !player.duration || player.currentTime < 1) return;
  const body = JSON.stringify({
    video_path: currentVideo,
    position: player.currentTime,
    duration: player.duration
  });
  if (useBeacon && navigator.sendBeacon) {
    navigator.sendBeacon('/api/progress?token=' + encodeURIComponent(token),
      new Blob([body], { type: 'application/json' }));
    return;
  }
  try {
    await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body
    });
  } catch (e) { console.error(e); }
}

player.addEventListener('pause', () => saveProgress());
player.addEventListener('ended', async () => {
  await saveProgress();
  if (currentTab !== 'all') loadTab(currentTab);
});
window.addEventListener('beforeunload', () => saveProgress(true));

function formatTime(s) {
  if (!s || isNaN(s)) return '0s';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function cssEscape(s) { return s.replace(/["\\]/g, '\\$&'); }

init();
</script>
</body>
</html>
