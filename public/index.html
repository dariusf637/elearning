<script>
(async () => {
  try {
    const r = await fetch('/api/setup/status');
    const data = await r.json();
    if (data.needsSetup) { window.location.href = '/setup.html'; return; }
  } catch (e) { console.error(e); }
})();

let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let userRole = localStorage.getItem('userRole') || 'user';
let currentVideo = null;
let currentSubtitles = [];
let currentVideoPath = null;
let currentVideoData = null;
let currentCourseVideos = [];
let saveTimer = null;
let currentCompleted = false;
let currentCoursePath = null;
let favoritesSet = new Set();
let autoNextTimer = null;
let autoNextTarget = null;
let currentQuiz = null;
let currentQuizAnswers = [];

const HOME_COMPLETED_LIMIT = 4;

const player = document.getElementById('player');
const subtitleBtn = document.getElementById('subtitle-btn');
const subtitleMenu = document.getElementById('subtitle-menu');
const completeBtn = document.getElementById('complete-btn');
const speedSelect = document.getElementById('speed-select');
const infoText = document.getElementById('info-text');
const resumeToast = document.getElementById('resume-toast');
const autoNextEl = document.getElementById('auto-next');
const anCount = document.getElementById('an-count');
const anName = document.getElementById('an-name');

function navigate(hash) { window.location.hash = hash; }

function showView(name) {
  document.querySelectorAll('.view').forEach(v => { v.classList.remove('active'); v.style.display = 'none'; });
  const view = document.getElementById('view-' + name);
  view.classList.add('active');
  view.style.display = (name === 'login') ? 'flex' : 'block';
  if (name !== 'course') { stopPlayer(); cancelAutoNext(); }
}

function router() {
  const hash = window.location.hash || '#/home';
  if (!token) { showView('login'); return; }
  document.querySelectorAll('#navbar .nav-links a').forEach(a => a.classList.remove('active'));

  if (hash.startsWith('#/course/')) {
    const encoded = hash.slice('#/course/'.length);
    const coursePath = decodeURIComponent(encoded.split('?')[0]);
    const params = new URLSearchParams(encoded.split('?')[1] || '');
    const playVideoParam = params.get('play');
    showView('course');
    loadCourseDetail(coursePath, playVideoParam);
  } else if (hash.startsWith('#/courses')) {
    showView('courses');
    document.querySelector('[data-nav="courses"]').classList.add('active');
    loadCoursesGrid('courses-grid');
  } else if (hash.startsWith('#/in-progress')) {
    showView('in-progress');
    document.querySelector('[data-nav="in-progress"]').classList.add('active');
    loadInProgressPage();
  } else if (hash.startsWith('#/completed')) {
    showView('completed');
    document.querySelector('[data-nav="completed"]').classList.add('active');
    loadCompletedPage();
  } else if (hash.startsWith('#/favorites')) {
    showView('favorites');
    document.querySelector('[data-nav="favorites"]').classList.add('active');
    loadFavoritesPage();
  } else if (hash.startsWith('#/admin')) {
    if (userRole !== 'admin') { navigate('#/home'); return; }
    showView('admin');
    document.querySelector('[data-nav="admin"]').classList.add('active');
    loadUsers();
  } else {
    showView('home');
    document.querySelector('[data-nav="home"]').classList.add('active');
    loadHome();
  }
}

window.addEventListener('hashchange', router);

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!u || !p) { err.textContent = 'Remplissez les deux champs'; return; }
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    if (!r.ok) { const d = await r.json(); err.textContent = d.error || 'Erreur'; return; }
    const data = await r.json();
    token = data.token; username = data.username; userRole = data.role;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
    localStorage.setItem('userRole', userRole);
    await loadFavoritesKeys();
    setupNavbar();
    if (!window.location.hash || window.location.hash === '#') navigate('#/home');
    else router();
  } catch { err.textContent = 'Erreur réseau'; }
}

document.getElementById('btn-logout').onclick = () => {
  saveProgress();
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  localStorage.removeItem('userRole');
  location.reload();
};

function setupNavbar() {
  document.getElementById('nav-username').textContent = username || '';
  if (userRole === 'admin') {
    document.getElementById('nav-admin').style.display = 'inline-block';
    document.getElementById('nav-username').innerHTML = `${escapeHtml(username)} <span class="role-badge">ADMIN</span>`;
  }
  document.getElementById('home-username').textContent = username || '';
}

async function loadFavoritesKeys() {
  try {
    const r = await fetch('/api/favorites/keys', { headers: { Authorization: 'Bearer ' + token } });
    const keys = await r.json();
    favoritesSet = new Set(keys);
  } catch {}
}

// ============ RECHERCHE ============
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimeout = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  searchTimeout = setTimeout(() => doSearch(q), 250);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { searchResults.classList.remove('open'); searchInput.blur(); }
});

document.addEventListener('click', (e) => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.classList.remove('open');
});

async function doSearch(q) {
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q), { headers: { Authorization: 'Bearer ' + token } });
    const data = await r.json();
    searchResults.innerHTML = '';
    if (!data.courses.length && !data.lessons.length) {
      searchResults.innerHTML = '<div class="sr-empty">Aucun résultat pour "' + escapeHtml(q) + '"</div>';
      searchResults.classList.add('open');
      return;
    }
    if (data.courses.length) {
      const cat = document.createElement('div');
      cat.className = 'sr-cat'; cat.textContent = 'Cours';
      searchResults.appendChild(cat);
      data.courses.forEach(c => {
        const el = document.createElement('div');
        el.className = 'sr-item';
        el.innerHTML = `📁 ${escapeHtml(c.name)}`;
        el.onclick = () => { searchResults.classList.remove('open'); searchInput.value = ''; navigate('#/course/' + encodeURIComponent(c.path)); };
        searchResults.appendChild(el);
      });
    }
    if (data.lessons.length) {
      const cat = document.createElement('div');
      cat.className = 'sr-cat'; cat.textContent = 'Leçons et documents';
      searchResults.appendChild(cat);
      data.lessons.forEach(l => {
        const el = document.createElement('div');
        el.className = 'sr-item';
        const icon = l.isDoc ? '📄' : '▶';
        el.innerHTML = `${icon} ${escapeHtml(l.name)}<div class="sr-sub">${escapeHtml(l.course || '')}</div>`;
        el.onclick = () => {
          searchResults.classList.remove('open');
          searchInput.value = '';
          navigate('#/course/' + encodeURIComponent(l.path.split('/')[0]) + '?play=' + encodeURIComponent(l.path));
        };
        searchResults.appendChild(el);
      });
    }
    searchResults.classList.add('open');
  } catch {}
}

// ============ CARTES ============
function renderCourseProgressCard(c, opts = {}) {
  const el = document.createElement('div');
  el.className = 'card';
  const playIcon = opts.done ? '<div class="card-play done">✓</div>' :
                   opts.resume ? '<div class="card-play">▶</div>' : '';
  const percentLabel = opts.done ? '100% · Terminé' :
                       opts.resume ? `${c.percent}% · Reprendre` : `${c.percent}%`;
  el.innerHTML = `
    ${playIcon}
    <div class="card-title">${escapeHtml(c.name)}</div>
    <div class="card-meta">${c.completed} / ${c.videoCount} leçons</div>
    <div class="card-bar"><div style="width:${c.percent}%${opts.done ? ';background:#4ade80' : ''}"></div></div>
    <div class="card-percent">
      <span>${percentLabel}</span>
      ${c.percent < 100 && c.percent > 0 ? `<span class="lessons-done">${c.videoCount - c.completed} restantes</span>` : ''}
    </div>
  `;
  el.onclick = () => {
    const url = '#/course/' + encodeURIComponent(c.path) + (c.lastVideoPath ? '?play=' + encodeURIComponent(c.lastVideoPath) : '');
    navigate(url);
  };
  return el;
}

function renderLessonFavoriteCard(v) {
  const name = v.video_path.split('/').pop();
  const course = v.video_path.split('/')[0];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-play" style="background:#f59e0b;">⭐</div>
    <div class="card-title">${escapeHtml(name)}</div>
    <div class="card-meta">${escapeHtml(course)}</div>
    <div class="card-bar"><div style="width:${v.percent}%"></div></div>
    <div class="card-percent">${v.percent}%${v.completed ? ' · Terminé' : ''}</div>
    <div style="margin-top:10px;">
      <button class="btn" style="width:100%;" onclick="event.stopPropagation(); removeFavorite('${escapeJs(v.video_path)}')">Retirer des favoris</button>
    </div>
  `;
  el.onclick = () => navigate('#/course/' + encodeURIComponent(course) + '?play=' + encodeURIComponent(v.video_path));
  return el;
}

// ============ HOME ============
async function loadHome() {
  try {
    const r = await fetch('/api/resume', { headers: { Authorization: 'Bearer ' + token } });
    const resume = await r.json();
    const grid = document.getElementById('home-resume-grid');
    grid.innerHTML = '';
    if (resume.length === 0) grid.innerHTML = '<div class="empty">Aucun cours en cours. Lancez une vidéo pour la voir ici.</div>';
    else resume.forEach(c => grid.appendChild(renderCourseProgressCard(c, { resume: true })));
  } catch {
    document.getElementById('home-resume-grid').innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
  await loadCompletedLimited();
  loadCoursesGrid('home-courses-grid');
}

async function loadCompletedLimited() {
  const grid = document.getElementById('home-completed-grid');
  const action = document.getElementById('home-completed-action');
  try {
    const r = await fetch('/api/completed', { headers: { Authorization: 'Bearer ' + token } });
    const all = await r.json();
    grid.innerHTML = ''; action.innerHTML = '';
    if (all.length === 0) { grid.innerHTML = '<div class="empty">Aucun cours terminé. Complétez un cours pour le voir ici.</div>'; return; }
    all.slice(0, HOME_COMPLETED_LIMIT).forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: true })));
    if (all.length > HOME_COMPLETED_LIMIT) {
      const btn = document.createElement('button');
      btn.className = 'section-action';
      btn.textContent = `Voir les ${all.length} terminés →`;
      btn.onclick = () => navigate('#/completed');
      action.appendChild(btn);
    } else {
      const count = document.createElement('span');
      count.className = 'section-count';
      count.textContent = `(${all.length})`;
      action.appendChild(count);
    }
  } catch { grid.innerHTML = '<div class="empty">Erreur de chargement</div>'; }
}

async function loadCompletedPage() {
  const grid = document.getElementById('completed-grid');
  const counter = document.getElementById('completed-count');
  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/completed', { headers: { Authorization: 'Bearer ' + token } });
    const rows = await r.json();
    grid.innerHTML = '';
    if (!rows.length) { counter.textContent = ''; grid.innerHTML = '<div class="empty">Aucun cours terminé.</div>'; return; }
    counter.textContent = `(${rows.length})`;
    rows.forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: true })));
  } catch { grid.innerHTML = '<div class="empty">Erreur de chargement</div>'; }
}

async function loadInProgressPage() {
  const grid = document.getElementById('in-progress-grid');

  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/in-progress', { headers: { Authorization: 'Bearer ' + token } });

    grid.innerHTML = '';

    counter.textContent = `(${rows.length})`;
    rows.forEach(c => grid.appendChild(renderCourseProgressCard(c, { resume: true })));

async function loadFavoritesPage() {
  const grid = document.getElementById('favorites-grid');
  const counter = document.getElementById('favorites-count');
  grid.innerHTML = '<div class="empty">Chargement…</div>';

    const r = await fetch('/api/favorites', { headers: { Authorization: 'Bearer ' + token } });

async function loadCoursesGrid(targetId) {
  const grid = document.getElementById(targetId);
  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/courses/top', { headers: { Authorization: 'Bearer ' + token } });
    const courses = await r.json();
    grid.innerHTML = '';
    if (!courses.length) { grid.innerHTML = '<div class="empty">Aucun cours trouvé.</div>'; return; }
    courses.forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: c.isFullyDone })));
  } catch { grid.innerHTML = '<div class="empty">Erreur de chargement</div>'; }
}

// ============ FAVORIS ============
async function toggleFavorite(videoPath) {
  const isFav = favoritesSet.has(videoPath);
  try {
    if (isFav) {
      await fetch('/api/favorites', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ video_path: videoPath })
      });
      favoritesSet.delete(videoPath);
    } else {
      await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ video_path: videoPath })
      });
      favoritesSet.add(videoPath);
    }
    document.querySelectorAll(`.lesson[data-path="${cssEscape(videoPath)}"] .fav-btn`)
      .forEach(el => {
        const active = favoritesSet.has(videoPath);
        el.classList.toggle('active', active);
        el.textContent = active ? '⭐' : '☆';
      });
  } catch {}
}

async function removeFavorite(videoPath) {
  await toggleFavorite(videoPath);
  loadFavoritesPage();
}

// ============ COURSE DETAIL ============
async function loadCourseDetail(coursePath, autoPlayVideo) {
  currentCoursePath = coursePath;
  document.getElementById('course-title').textContent = coursePath.split('/').pop();
  const lessons = document.getElementById('course-lessons');
  lessons.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/courses/detail/' + encodeURIComponent(coursePath), { headers: { Authorization: 'Bearer ' + token } });
    const items = await r.json();
    lessons.innerHTML = '';
    if (!items.length) { lessons.innerHTML = '<div class="empty">Aucune leçon.</div>'; return; }
    currentCourseVideos = [];
    collectVideos(items, currentCourseVideos);
    renderLessons(items, lessons);
    if (autoPlayVideo) {
      const target = currentCourseVideos.find(v => v.path === autoPlayVideo);
      if (target) playVideo(target);
      else {
        const findDoc = (items) => {
          for (const it of items) {
            if (it.type === 'document' && it.path === autoPlayVideo) return it;
            if (it.type === 'folder') { const r = findDoc(it.children); if (r) return r; }
          }
          return null;
        };
        const doc = findDoc(items);
        if (doc) openDocument(doc);
      }
    }
  } catch { lessons.innerHTML = '<div class="empty">Erreur de chargement</div>'; }
}

function collectVideos(items, out) {
  for (const it of items) {
    if (it.type === 'folder') collectVideos(it.children, out);
    else if (it.type === 'video') out.push(it);
  }
}

function countVideos(items) {
  let n = 0;
  for (const it of items) {
    if (it.type === 'folder') n += countVideos(it.children);
    else if (it.type === 'video') n++;
  }
  return n;
}

// ============ RENDU DES LEÇONS + DOCS MÉLANGÉS ============
function renderLessons(items, container) {
  for (const item of items) {
    if (item.type === 'folder') {
      const wrapper = document.createElement('div');
      wrapper.className = 'folder-wrapper';
      const count = countVideos(item.children);
      const header = document.createElement('div');
      header.className = 'folder-header';
      header.innerHTML = `<span class="folder-chevron">▶</span><span class="folder-name">${escapeHtml(item.name)}</span><span class="folder-count">${count}</span>`;
      const children = document.createElement('div');
      children.className = 'folder-children collapsed';
      header.onclick = () => {
        const isOpen = header.classList.toggle('open');
        children.classList.toggle('collapsed', !isOpen);
      };
      wrapper.appendChild(header);
      wrapper.appendChild(children);
      container.appendChild(wrapper);
      renderLessons(item.children, children);
    } else if (item.type === 'video') {
      const el = document.createElement('div');
      el.className = 'lesson';
      el.dataset.path = item.path;
      const ccBadge = item.subtitles && item.subtitles.length ? `<span class="cc-badge">CC ${item.subtitles.length}</span>` : '';
      const qzBadge = item.quiz ? `<span class="quiz-badge">📝</span>` : '';
      const isFav = favoritesSet.has(item.path);
      el.innerHTML = `
        <div class="title-row">
          <span class="name">▶ ${escapeHtml(item.name)}</span>
          <span style="display:flex;gap:4px;align-items:center;">
            ${ccBadge}${qzBadge}
            <span class="fav-btn ${isFav ? 'active' : ''}" title="Favori">${isFav ? '⭐' : '☆'}</span>
          </span>
        </div>
      `;
      el.querySelector('.fav-btn').onclick = (e) => { e.stopPropagation(); toggleFavorite(item.path); };
      el.onclick = () => playVideo(item);
      container.appendChild(el);
    } else if (item.type === 'document') {
      const el = document.createElement('div');
      el.className = 'doc-item';
      el.dataset.path = item.path;
      el.innerHTML = `<span class="doc-icon">📄</span><span class="doc-name">${escapeHtml(item.name)}</span>`;
      el.onclick = () => openDocument(item);
      container.appendChild(el);
    }
  }
}

function expandParentFolders(videoPath) {
  const lessonEl = document.querySelector(`.lesson[data-path="${cssEscape(videoPath)}"], .doc-item[data-path="${cssEscape(videoPath)}"]`);
  if (!lessonEl) return;
  let el = lessonEl.parentElement;
  while (el) {
    if (el.classList && el.classList.contains('folder-children')) {
      el.classList.remove('collapsed');
      const header = el.previousElementSibling;
      if (header && header.classList.contains('folder-header')) header.classList.add('open');
    }
    el = el.parentElement;
  }
}

// ============ PLAYER ============
async function playVideo(item) {
  cancelAutoNext();
  document.querySelector('.player-wrap').classList.remove('pdf-active');
  document.getElementById('pdf-viewer').src = 'about:blank';
  document.getElementById('back-to-video-btn').style.display = 'none';
  document.getElementById('speed-select').style.display = '';
  document.querySelectorAll('.doc-item').forEach(e => e.classList.remove('active'));

  const videoPath = item.path;
  const displayName = item.name;
  currentVideo = videoPath;
  currentVideoPath = videoPath;
  currentSubtitles = item.subtitles || [];
  currentVideoData = item;

  document.querySelectorAll('.lesson').forEach(e => e.classList.remove('active'));
  document.querySelectorAll(`.lesson[data-path="${cssEscape(videoPath)}"]`).forEach(e => e.classList.add('active'));
  expandParentFolders(videoPath);

  infoText.textContent = '⏳ Chargement…';
  resumeToast.style.display = 'none';
  completeBtn.style.display = 'none';
  subtitleBtn.style.display = 'none';
  subtitleMenu.classList.remove('open');

  let progress = { position: 0, duration: 0, completed: 0 };
  try {
    const r = await fetch('/api/progress/' + encodeURIComponent(videoPath), { headers: { Authorization: 'Bearer ' + token } });
    progress = await r.json();
  } catch {}
  currentCompleted = !!progress.completed;

  player.querySelectorAll('track').forEach(t => t.remove());
  player.removeAttribute('src');
  player.load();

  currentSubtitles.forEach((sub, idx) => {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = formatLangLabel(sub.lang);
    track.srclang = sub.lang === 'default' ? 'fr' : sub.lang.slice(0, 3);
    track.src = '/api/subtitle/' + encodeURIComponent(sub.path) + '?token=' + encodeURIComponent(token);
    if (idx === 0) track.default = true;
    player.appendChild(track);
  });

  player.src = '/api/stream/' + encodeURIComponent(videoPath) + '?token=' + encodeURIComponent(token);
  player.playbackRate = parseFloat(localStorage.getItem('speed') || '1');
  speedSelect.value = player.playbackRate.toString();
  player.load();

  player.onloadedmetadata = () => {
    if (progress.position > 5 && progress.position < player.duration - 5 && !currentCompleted) {
      player.currentTime = progress.position;
      resumeToast.textContent = '⏪ Reprise à ' + formatTime(progress.position);
      resumeToast.style.display = 'block';
      setTimeout(() => resumeToast.style.display = 'none', 3000);
    }
    infoText.textContent = displayName + ' — ' + formatTime(player.duration);
    completeBtn.style.display = 'inline-block';
    updateCompleteBtn();

    if (currentSubtitles.length > 0) {
      subtitleBtn.style.display = 'inline-block';
      buildSubtitleMenu();
      const savedLang = localStorage.getItem('subtitle_' + videoPath);
      setTimeout(() => {
        if (savedLang === 'off') setSubtitleMode('off');
        else if (savedLang) {
          const idx = currentSubtitles.findIndex(s => s.lang === savedLang);
          if (idx >= 0) enableTrack(idx); else enableTrack(0);
        } else enableTrack(0);
      }, 100);
    }
  };

  player.onerror = () => { infoText.textContent = '❌ Erreur de lecture : ' + displayName; };
  player.play().catch(() => {});

  if (saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(() => saveProgress(), 10000);
}

function stopPlayer() {
  if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }
  try { player.pause(); } catch {}
}

player.addEventListener('pause', () => saveProgress());
player.addEventListener('ended', async () => {
  await saveProgress();
  if (!currentCompleted) {
    await markCompleted(currentVideo, true);
    currentCompleted = true;
    updateCompleteBtn();
  }
  scheduleAutoNext();
});
window.addEventListener('beforeunload', () => saveProgress(true));

// ============ DOCUMENT VIEWER ============
function openDocument(doc) {
  cancelAutoNext();
  stopPlayer();

  document.querySelectorAll('.lesson, .doc-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll(`.doc-item[data-path="${cssEscape(doc.path)}"]`).forEach(e => e.classList.add('active'));

  const wrap = document.querySelector('.player-wrap');
  const pdfViewer = document.getElementById('pdf-viewer');
  const backBtn = document.getElementById('back-to-video-btn');

  wrap.classList.add('pdf-active');
  pdfViewer.src = '/api/document/' + encodeURIComponent(doc.path) + '?token=' + encodeURIComponent(token);
  backBtn.style.display = 'inline-block';

  infoText.textContent = '📄 ' + doc.name;

  document.getElementById('complete-btn').style.display = 'none';
  document.getElementById('subtitle-btn').style.display = 'none';
}

document.getElementById('back-to-video-btn').onclick = () => {

speedSelect.onchange = () => {

// ============ AUTO-NEXT ============
function scheduleAutoNext() {
  const idx = currentCourseVideos.findIndex(v => v.path === currentVideo);
  if (idx < 0 || idx >= currentCourseVideos.length - 1) return;
  autoNextTarget = currentCourseVideos[idx + 1];
  anName.textContent = autoNextTarget.name;
  autoNextEl.style.display = 'block';
  let count = 5;
  anCount.textContent = count;
  autoNextTimer = setInterval(() => {
    count--;
    anCount.textContent = count;
    if (count <= 0) {
      cancelAutoNext();
      playVideo(autoNextTarget);
    }
  }, 1000);
}

function cancelAutoNext() {
  if (autoNextTimer) { clearInterval(autoNextTimer); autoNextTimer = null; }
  autoNextEl.style.display = 'none';
  autoNextTarget = null;
}

document.getElementById('an-play').onclick = () => {
  const target = autoNextTarget;
  cancelAutoNext();
  if (target) playVideo(target);
};
document.getElementById('an-cancel').onclick = () => cancelAutoNext();

// ============ RACCOURCIS ============
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const courseView = document.getElementById('view-course');
  if (!courseView.classList.contains('active')) return;
  if (document.querySelector('.player-wrap').classList.contains('pdf-active')) return;

  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (player.paused) player.play().catch(()=>{}); else player.pause();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      player.currentTime = Math.max(0, player.currentTime - 5);
      break;
    case 'ArrowRight':
      e.preventDefault();
      player.currentTime = Math.min(player.duration || 0, player.currentTime + 5);
      break;
    case 'ArrowUp':
      e.preventDefault();
      player.volume = Math.min(1, player.volume + 0.1);
      break;
    case 'ArrowDown':
      e.preventDefault();
      player.volume = Math.max(0, player.volume - 0.1);
      break;
    case 'f': case 'F':
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else player.requestFullscreen?.();
      break;
    case 'c': case 'C':
      e.preventDefault();
      if (currentSubtitles.length > 0) {
        const tracks = player.textTracks;
        let anyShowing = false;
        for (let i = 0; i < tracks.length; i++) if (tracks[i].mode === 'showing') anyShowing = true;
        if (anyShowing) setSubtitleMode('off');
        else enableTrack(0);
      }
      break;
    case 'n': case 'N': playNextLesson(); break;
    case 'p': case 'P': playPrevLesson(); break;
  }
});

function playNextLesson() {
  const idx = currentCourseVideos.findIndex(v => v.path === currentVideo);
  if (idx >= 0 && idx < currentCourseVideos.length - 1) playVideo(currentCourseVideos[idx + 1]);
}
function playPrevLesson() {
  const idx = currentCourseVideos.findIndex(v => v.path === currentVideo);
  if (idx > 0) playVideo(currentCourseVideos[idx - 1]);
}

// ============ SOUS-TITRES ============
function formatLangLabel(lang) {
  if (lang === 'default') return 'Par défaut';
  const labels = {
    fr:'Français', en:'Anglais', es:'Espagnol', de:'Allemand', it:'Italien',
    pt:'Portugais', ru:'Russe', ar:'Arabe', zh:'Chinois', ja:'Japonais', ko:'Coréen',
    nl:'Néerlandais', pl:'Polonais', tr:'Turc', sv:'Suédois', no:'Norvégien',
    da:'Danois', fi:'Finnois', cs:'Tchèque', el:'Grec', he:'Hébreu',
    hu:'Hongrois', ro:'Roumain', uk:'Ukrainien', vi:'Vietnamien', th:'Thaï',
    id:'Indonésien', hi:'Hindi', bg:'Bulgare', hr:'Croate', sr:'Serbe',
    sk:'Slovaque', sl:'Slovène', lt:'Lituanien', lv:'Letton', et:'Estonien', fa:'Persan'
  };
  return labels[lang] || lang.toUpperCase();
}

function enableTrack(idx) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) tracks[i].mode = (i === idx) ? 'showing' : 'disabled';
  const lang = currentSubtitles[idx] ? currentSubtitles[idx].lang : 'default';
  localStorage.setItem('subtitle_' + currentVideoPath, lang);
  updateSubtitleMenuSelection(idx);
}

function setSubtitleMode(mode) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'disabled';
  if (mode === 'off') {
    localStorage.setItem('subtitle_' + currentVideoPath, 'off');
    updateSubtitleMenuSelection(-1);
  }
}

function buildSubtitleMenu() {
  subtitleMenu.innerHTML = '<div class="header">Sous-titres</div>';
  currentSubtitles.forEach((sub, idx) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.dataset.idx = idx;
    item.textContent = formatLangLabel(sub.lang);
    item.onclick = () => { enableTrack(idx); subtitleMenu.classList.remove('open'); };
    subtitleMenu.appendChild(item);
  });
  const offItem = document.createElement('div');
  offItem.className = 'item';
  offItem.dataset.idx = '-1';
  offItem.textContent = '❌ Désactivés';
  offItem.onclick = () => { setSubtitleMode('off'); subtitleMenu.classList.remove('open'); };
  subtitleMenu.appendChild(offItem);
}

function updateSubtitleMenuSelection(idx) {
  subtitleMenu.querySelectorAll('.item').forEach(item => {
    item.classList.toggle('selected', parseInt(item.dataset.idx) === idx);
  });
}

subtitleBtn.onclick = (e) => { e.stopPropagation(); subtitleMenu.classList.toggle('open'); };
document.addEventListener('click', (e) => {
  if (!subtitleMenu.contains(e.target) && e.target !== subtitleBtn) subtitleMenu.classList.remove('open');
});

// ============ TERMINÉ / QUIZ ============
function updateCompleteBtn() {
  completeBtn.textContent = currentCompleted ? '↺ Non terminé' : '✅ Marquer terminé';
  completeBtn.style.background = currentCompleted ? '#4ade80' : '';
  completeBtn.style.color = currentCompleted ? '#000' : '';
  completeBtn.onclick = async () => {
    if (!currentCompleted && currentVideoData && currentVideoData.quiz) {
      openQuiz(currentVideoData);
      return;
    }
    await markCompleted(currentVideo, !currentCompleted);
    currentCompleted = !currentCompleted;
    updateCompleteBtn();
  };
}

async function markCompleted(videoPath, completed) {
  if (!player.duration) return;
  const position = completed ? player.duration : 0;
  await fetch('/api/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ video_path: videoPath, position, duration: player.duration })
  });
}

// ============ QUIZ ============
const quizOverlay = document.getElementById('quiz-overlay');
const quizBody = document.getElementById('quiz-body');
const quizResult = document.getElementById('quiz-result');
const quizValidate = document.getElementById('quiz-validate');
const quizCloseBtn = document.getElementById('quiz-close-btn');
const quizLessonName = document.getElementById('quiz-lesson-name');

document.getElementById('quiz-close').onclick = closeQuiz;
document.getElementById('quiz-close-btn').onclick = closeQuiz;

function closeQuiz() {
  quizOverlay.classList.remove('open');
  currentQuiz = null;
  currentQuizAnswers = [];
}

async function openQuiz(video) {
  try {
    const r = await fetch('/api/quiz/' + encodeURIComponent(video.quiz.path), { headers: { Authorization: 'Bearer ' + token } });
    const data = await r.json();
    if (!data.questions || !data.questions.length) { closeQuiz(); return; }
    currentQuiz = data;
    currentQuizAnswers = new Array(data.questions.length).fill(-1);
    quizLessonName.textContent = video.name;
    quizResult.textContent = '';
    quizResult.className = 'quiz-result';
    quizValidate.style.display = 'inline-block';
    quizCloseBtn.style.display = 'none';
    renderQuiz();
    quizOverlay.classList.add('open');
  } catch {}
}

function renderQuiz() {
  quizBody.innerHTML = '';
  currentQuiz.questions.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text"><span class="q-num">Q${qi + 1}.</span>${escapeHtml(q.question)}</div>`;
    q.options.forEach((opt, oi) => {
      const optEl = document.createElement('div');
      optEl.className = 'q-option';
      optEl.dataset.q = qi;
      optEl.dataset.o = oi;
      optEl.innerHTML = `<input type="radio" name="q${qi}" ${currentQuizAnswers[qi] === oi ? 'checked' : ''}><span>${escapeHtml(opt)}</span>`;
      optEl.onclick = (e) => {
        if (e.target.tagName !== 'INPUT') optEl.querySelector('input').checked = true;
        currentQuizAnswers[qi] = oi;
        quizBody.querySelectorAll(`.q-option[data-q="${qi}"]`).forEach(o => o.classList.remove('selected'));
        optEl.classList.add('selected');
      };
      if (currentQuizAnswers[qi] === oi) optEl.classList.add('selected');
      div.appendChild(optEl);
    });
    const expl = document.createElement('div');
    expl.className = 'q-explanation';
    expl.dataset.q = qi;
    expl.textContent = q.explanation || '';
    div.appendChild(expl);
    quizBody.appendChild(div);
  });
}

quizValidate.onclick = () => {
  if (currentQuizAnswers.some(a => a === -1)) {
    quizResult.textContent = 'Répondez à toutes les questions.';
    quizResult.className = 'quiz-result fail';
    return;
  }
  let correct = 0;
  currentQuiz.questions.forEach((q, qi) => {
    const userAns = currentQuizAnswers[qi];
    const isCorrect = userAns === q.correct;
    if (isCorrect) correct++;
    quizBody.querySelectorAll(`.q-option[data-q="${qi}"]`).forEach(o => {
      const oi = parseInt(o.dataset.o, 10);
      o.classList.remove('selected');
      if (oi === q.correct) o.classList.add('correct');
      if (oi === userAns && !isCorrect) o.classList.add('wrong');
      o.onclick = null;
    });
    const expl = quizBody.querySelector(`.q-explanation[data-q="${qi}"]`);
    if (expl && expl.textContent) expl.classList.add('show');
  });
  const total = currentQuiz.questions.length;
  const pass = correct === total;
  quizResult.textContent = `${correct}/${total} ${pass ? '✓ Bravo !' : '— Révisez et réessayez.'}`;
  quizResult.className = 'quiz-result ' + (pass ? 'pass' : 'fail');
  quizValidate.style.display = 'none';
  quizCloseBtn.style.display = 'inline-block';
  if (pass) {
    (async () => {
      await markCompleted(currentVideo, true);
      currentCompleted = true;
      updateCompleteBtn();
    })();
  }
};

// ============ UTILS ============
function formatTime(s) {
  if (!s || isNaN(s)) return '0s';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function cssEscape(s) { return s.replace(/["\\]/g, '\\$&'); }

document.getElementById('create-user-btn').onclick = async () => {
  const u = document.getElementById('new-username').value.trim();
  const p = document.getElementById('new-password').value;
  const role = document.getElementById('new-role').value;
  const err = document.getElementById('admin-error');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'Remplissez les champs'; return; }
  try {
    const r = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ username: u, password: p, role })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Erreur'; return; }
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-role').value = 'user';
    loadUsers();
  } catch { err.textContent = 'Erreur réseau'; }
};

async function loadUsers() {
  const list = document.getElementById('admin-user-list');
  list.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/admin/users', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { list.innerHTML = '<div class="empty">Erreur</div>'; return; }
    const users = await r.json();
    list.innerHTML = '';
    if (!users.length) { list.innerHTML = '<div class="empty">Aucun utilisateur</div>'; return; }
    users.forEach(u => {
      const el = document.createElement('div');
      el.className = 'user-row';
      const badge = u.role === 'admin' ? '<span class="role-badge">ADMIN</span>' : '';
      const created = u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '—';
      el.innerHTML = `
        <div class="info">
          <div class="name">${escapeHtml(u.username)}${badge}</div>
          <div class="sub">Créé le ${created} · ${u.courses_started || 0} cours commencés</div>
        </div>
        <div class="actions">
          <button class="mini-btn" data-reset="${u.id}" data-name="${escapeHtml(u.username)}">🔑 Mot de passe</button>
          ${u.username !== username ? `<button class="mini-btn danger" data-del="${u.id}" data-name="${escapeHtml(u.username)}">🗑</button>` : ''}
        </div>
      `;
      list.appendChild(el);
    });
    list.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetPassword(parseInt(b.dataset.reset), b.dataset.name));
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteUser(parseInt(b.dataset.del), b.dataset.name));
  } catch { list.innerHTML = '<div class="empty">Erreur réseau</div>'; }
}

async function resetPassword(id, name) {
  const p = prompt(`Nouveau mot de passe pour "${name}" (min 6) :`);
  if (!p) return;
  if (p.length < 6) { alert('Trop court'); return; }
  const r = await fetch(`/api/admin/users/${id}/password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ password: p })
  });
  alert(r.ok ? 'Mot de passe réinitialisé.' : 'Erreur.');
}

async function deleteUser(id, name) {
  if (!confirm(`Supprimer "${name}" et toute sa progression ?`)) return;
  const r = await fetch(`/api/admin/users/${id}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
  if (r.ok) loadUsers();
  else alert('Erreur lors de la suppression.');
}
