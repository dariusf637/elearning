<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Plateforme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #navbar { min-height: 56px; background: #1a1a2e; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 16px; gap: 16px; flex-shrink: 0; flex-wrap: nowrap; }
  #navbar .brand { color: #e94560; font-weight: 700; font-size: 16px; white-space: nowrap; }
  #navbar .nav-links { display: flex; gap: 4px; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #navbar .nav-links::-webkit-scrollbar { display: none; }
  #navbar .nav-links a { color: #999; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  #navbar .nav-links a:hover { color: #fff; background: #16213e; }
  #navbar .nav-links a.active { color: #fff; background: #16213e; }
  #navbar .nav-user { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; flex-shrink: 0; }
  #navbar .nav-user .role-badge { background: #e94560; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  #navbar button { background: none; border: 1px solid #333; color: #aaa; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap; }
  #navbar button:hover { border-color: #e94560; color: #e94560; }

  #main { flex: 1; overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; display: none; }
  .view.active { display: block; }
  .page-container { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  .page-container h1 { font-size: 24px; margin-bottom: 20px; }
  .page-container h2 { font-size: 15px; color: #ccc; margin: 26px 0 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  .page-container h2 .section-action { font-size: 11px; text-transform: none; letter-spacing: 0; color: #e94560; cursor: pointer; font-weight: 500; background: none; border: none; padding: 4px 8px; border-radius: 4px; }
  .page-container h2 .section-action:hover { background: rgba(233,69,96,0.15); }
  .page-container h2 .section-count { font-size: 11px; text-transform: none; letter-spacing: 0; color: #555; font-weight: 400; margin-left: 8px; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: #1a1a2e; border: 1px solid #222; border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .card:hover { border-color: #e94560; transform: translateY(-2px); }
  .card .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2; min-height: 34px; }
  .card .card-meta { font-size: 11px; color: #888; margin-bottom: 10px; }
  .card .card-bar { height: 5px; background: #333; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .card .card-bar > div { height: 100%; background: #4ade80; transition: width 0.3s; }
  .card .card-percent { font-size: 11px; color: #4ade80; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .card .card-percent .lessons-done { color: #888; font-weight: 400; font-size: 10px; }
  .card .card-play { position: absolute; top: 12px; right: 12px; background: #e94560; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .card .card-play.done { background: #4ade80; color: #000; }
  .card .card-meta-course { color: #666; font-size: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .course-layout { display: flex; height: 100%; }
  .course-sidebar { width: 360px; background: #1a1a2e; display: flex; flex-direction: column; border-right: 1px solid #222; flex-shrink: 0; }
  .course-sidebar .course-header { padding: 12px 16px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
  .course-sidebar .course-header button { background: #333; border: none; color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .course-sidebar .course-header button:hover { background: #e94560; }
  .course-sidebar .course-header h2 { font-size: 13px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .course-sidebar .lesson-list { flex: 1; overflow-y: auto; padding: 8px; }
  .course-main { flex: 1; display: flex; flex-direction: column; background: #000; min-width: 0; }
  .player-wrap { flex: 1; position: relative; background: #000; min-height: 200px; }
  video { width: 100%; height: 100%; background: #000; outline: none; }
  video::cue { background: rgba(0,0,0,0.75); color: #fff; font-size: 22px; line-height: 1.4; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
  #resume-toast { position: absolute; bottom: 20px; left: 20px; background: rgba(233,69,96,0.95); padding: 10px 16px; border-radius: 6px; font-size: 13px; display: none; }
  .player-info { padding: 10px 16px; background: #1a1a2e; font-size: 13px; color: #aaa; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; flex-wrap: wrap; }
  .player-info .info-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 150px; }
  .player-info .info-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .btn:hover { background: #e94560; }

  .folder-wrapper { margin: 2px 0; }
  .folder-header { padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 6px; font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; user-select: none; transition: background 0.15s; }
  .folder-header:hover { background: #16213e; color: #fff; }
  .folder-chevron { display: inline-block; font-size: 9px; transition: transform 0.2s ease; flex-shrink: 0; width: 10px; text-align: center; }
  .folder-header.open .folder-chevron { transform: rotate(90deg); }
  .folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .folder-count { margin-left: auto; font-size: 10px; color: #555; font-weight: 400; background: #222; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
  .folder-header.open .folder-count { color: #4ade80; background: rgba(74,222,128,0.15); }
  .folder-children { margin-left: 10px; border-left: 1px solid #2a2a44; padding-left: 4px; overflow: hidden; }
  .folder-children.collapsed { display: none; }

  .lesson { padding: 11px 14px; cursor: pointer; font-size: 13px; border-radius: 6px; margin: 2px 0; display: flex; flex-direction: column; gap: 4px; }
  .lesson:hover { background: #16213e; }
  .lesson.active { background: #e94560; }
  .lesson .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .lesson .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson .cc-badge { font-size: 9px; background: #4ade80; color: #000; padding: 1px 5px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }

  #subtitle-menu { position: absolute; bottom: 100%; right: 12px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; padding: 6px; min-width: 200px; display: none; z-index: 10; max-height: 60vh; overflow-y: auto; }
  #subtitle-menu.open { display: block; }
  #subtitle-menu .item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; color: #ccc; }
  #subtitle-menu .item:hover { background: #16213e; color: #fff; }
  #subtitle-menu .item.selected { background: #e94560; color: #fff; }
  #subtitle-menu .header { padding: 6px 12px; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

  #view-login { display: none; align-items: center; justify-content: center; padding: 20px; }
  #view-login.active { display: flex; }
  .login-box { background: #1a1a2e; padding: 30px; border-radius: 10px; width: 100%; max-width: 340px; border: 1px solid #333; }
  .login-box h2 { color: #e94560; margin-bottom: 20px; text-align: center; font-size: 20px; }
  .login-box input { width: 100%; padding: 11px; margin: 6px 0; background: #0f0f1a; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 15px; }
  .login-box button { width: 100%; padding: 11px; margin-top: 12px; background: #e94560; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; }
  .login-box button:hover { background: #c73650; }
  .login-box .error { color: #e94560; font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }

  .admin-form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-form input, .admin-form select { padding: 9px 12px; background: #0f0f1a; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 13px; min-width: 180px; flex: 1; }
  .admin-form button { padding: 9px 16px; background: #e94560; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; }
  .admin-form button:hover { background: #c73650; }
  .admin-error { color: #e94560; font-size: 13px; margin-bottom: 15px; min-height: 18px; }
  .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1a1a2e; border-radius: 6px; margin: 6px 0; gap: 10px; }
  .user-row .info { flex: 1; min-width: 0; }
  .user-row .name { font-size: 14px; font-weight: 600; }
  .user-row .name .role-badge { background: #e94560; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 3px; margin-left: 6px; }
  .user-row .sub { font-size: 11px; color: #666; margin-top: 3px; }
  .user-row .mini-btn { font-size: 12px; padding: 5px 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .user-row .mini-btn:hover { background: #e94560; }
  .user-row .mini-btn.danger:hover { background: #c73650; }
  .user-row .actions { display: flex; gap: 5px; flex-shrink: 0; }

  .empty { padding: 30px 16px; color: #666; font-size: 13px; text-align: center; }

  @media (max-width: 900px) {
    .course-sidebar { width: 280px; }
    .page-container { padding: 20px; }
  }
  @media (max-width: 700px) {
    #navbar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; height: auto; min-height: 52px; }
    #navbar .brand { font-size: 14px; }
    #navbar .nav-user { order: 2; margin-left: auto; }
    #navbar .nav-links { order: 3; width: 100%; justify-content: flex-start; gap: 2px; border-top: 1px solid #222; padding-top: 6px; margin-top: 4px; }
    #navbar .nav-links a { font-size: 12px; padding: 6px 10px; }
    #navbar .nav-user #nav-username { display: none; }
    .page-container { padding: 16px 12px; }
    .page-container h1 { font-size: 20px; margin-bottom: 16px; }
    .page-container h2 { font-size: 13px; margin: 20px 0 10px; }
    .card-grid { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 12px; }
    .card .card-title { font-size: 13px; min-height: auto; }
    .course-layout { flex-direction: column-reverse; height: 100%; }
    .course-sidebar { width: 100%; max-height: 45%; border-right: none; border-top: 1px solid #222; order: 2; }
    .course-main { flex: 1; min-height: 0; order: 1; }
    .course-sidebar .course-header h2 { font-size: 12px; }
    .player-wrap { min-height: 180px; }
    .player-info { flex-direction: column; align-items: stretch; padding: 8px 12px; gap: 6px; }
    .player-info .info-text { font-size: 12px; white-space: normal; overflow: visible; text-overflow: clip; }
    .btn { font-size: 11px; padding: 5px 10px; }
    #subtitle-menu { right: 8px; left: 8px; min-width: 0; max-height: 50vh; }
    .login-box { padding: 24px 20px; }
    .admin-form { flex-direction: column; }
    .admin-form input, .admin-form select { min-width: 0; width: 100%; }
    .admin-form button { width: 100%; }
    .user-row { flex-direction: column; align-items: flex-start; }
    .user-row .actions { width: 100%; justify-content: flex-start; }
  }
  @media (max-width: 400px) {
    #navbar .brand { font-size: 13px; }
    #navbar .nav-links a { font-size: 11px; padding: 5px 8px; }
    .page-container h1 { font-size: 18px; }
    .course-sidebar { max-height: 50%; }
  }
</style>
</head>
<body>

<nav id="navbar">
  <div class="brand">📚 Ma Plateforme</div>
  <div class="nav-user">
    <span id="nav-username"></span>
    <button id="btn-logout">Déconnexion</button>
  </div>
  <div class="nav-links">
    <a href="#/home" data-nav="home">Accueil</a>
    <a href="#/courses" data-nav="courses">Tous les cours</a>
    <a href="#/in-progress" data-nav="in-progress">En cours</a>
    <a href="#/completed" data-nav="completed">Terminés</a>
    <a href="#/admin" data-nav="admin" id="nav-admin" style="display:none">Admin</a>
  </div>
</nav>

<main id="main">

  <div id="view-login" class="view">
    <div class="login-box">
      <h2>📚 Ma Plateforme</h2>
      <input type="text" id="login-username" placeholder="Nom d'utilisateur" autocomplete="off">
      <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="new-password">
      <button id="login-btn">Se connecter</button>
      <div class="error" id="login-error"></div>
    </div>
  </div>

  <div id="view-home" class="view">
    <div class="page-container">
      <h1>Bonjour <span id="home-username"></span></h1>
      <section id="home-resume-section">
        <h2>▶ Reprendre</h2>
        <div id="home-resume-grid" class="card-grid"></div>
      </section>
      <section id="home-completed-section">
        <h2>
          ✅ Cours terminés
          <span id="home-completed-action"></span>
        </h2>
        <div id="home-completed-grid" class="card-grid"></div>
      </section>
      <section>
        <h2>📚 Mes cours</h2>
        <div id="home-courses-grid" class="card-grid"></div>
      </section>
    </div>
  </div>

  <div id="view-courses" class="view">
    <div class="page-container">
      <h1>Tous les cours</h1>
      <div id="courses-grid" class="card-grid"></div>
    </div>
  </div>

  <div id="view-in-progress" class="view">
    <div class="page-container">
      <h1>▶ Cours en cours <span id="in-progress-count" style="font-size:14px;color:#666;font-weight:400;"></span></h1>
      <div id="in-progress-grid" class="card-grid"></div>
    </div>
  </div>

  <div id="view-completed" class="view">
    <div class="page-container">
      <h1>✅ Cours terminés <span id="completed-count" style="font-size:14px;color:#666;font-weight:400;"></span></h1>
      <div id="completed-grid" class="card-grid"></div>
    </div>
  </div>

  <div id="view-course" class="view">
    <div class="course-layout">
      <aside class="course-sidebar">
        <div class="course-header">
          <button id="course-back">← Retour</button>
          <h2 id="course-title"></h2>
        </div>
        <div class="lesson-list" id="course-lessons"></div>
      </aside>
      <div class="course-main">
        <div class="player-wrap">
          <video id="player" controls preload="metadata" playsinline></video>
          <div id="resume-toast"></div>
        </div>
        <div class="player-info">
          <span class="info-text" id="info-text">Sélectionnez une leçon</span>
          <div class="info-actions">
            <button class="btn" id="subtitle-btn" style="display:none;">💬 Sous-titres</button>
            <button class="btn" id="complete-btn" style="display:none;">✅ Marquer terminé</button>
            <button class="btn" id="archive-btn" style="display:none;">Archiver</button>
          </div>
          <div id="subtitle-menu"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-admin" class="view">
    <div class="page-container">
      <h1>⚙️ Administration</h1>
      <section>
        <h2>Créer un utilisateur</h2>
        <div class="admin-form">
          <input type="text" id="new-username" placeholder="Nom d'utilisateur">
          <input type="password" id="new-password" placeholder="Mot de passe (min 6)">
          <select id="new-role">
            <option value="user">Utilisateur (lecture seule)</option>
            <option value="admin">Administrateur</option>
          </select>
          <button id="create-user-btn">Créer</button>
        </div>
        <div class="admin-error" id="admin-error"></div>
      </section>
      <section>
        <h2>Utilisateurs existants</h2>
        <div id="admin-user-list"><div class="empty">Chargement…</div></div>
      </section>
    </div>
  </div>

</main>

<script>
(async () => {
  try {
    const r = await fetch('/api/setup/status');
    const data = await r.json();
    if (data.needsSetup) { window.location.href = '/setup.html'; return; }
  } catch (e) { console.error(e); }
})();

let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let userRole = localStorage.getItem('userRole') || 'user';
let currentVideo = null;
let currentSubtitles = [];
let currentVideoPath = null;
let saveTimer = null;
let currentArchived = false;
let currentCompleted = false;
let currentCoursePath = null;

const HOME_COMPLETED_LIMIT = 4;

const player = document.getElementById('player');
const subtitleBtn = document.getElementById('subtitle-btn');
const subtitleMenu = document.getElementById('subtitle-menu');
const archiveBtn = document.getElementById('archive-btn');
const completeBtn = document.getElementById('complete-btn');
const infoText = document.getElementById('info-text');
const resumeToast = document.getElementById('resume-toast');

function navigate(hash) { window.location.hash = hash; }

function showView(name) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const view = document.getElementById('view-' + name);
  view.classList.add('active');
  view.style.display = (name === 'login') ? 'flex' : 'block';
  if (name !== 'course') { stopPlayer(); }
}

function router() {
  const hash = window.location.hash || '#/home';
  if (!token) { showView('login'); return; }
  document.querySelectorAll('#navbar .nav-links a').forEach(a => a.classList.remove('active'));

  if (hash.startsWith('#/course/')) {
    const encoded = hash.slice('#/course/'.length);
    const coursePath = decodeURIComponent(encoded.split('?')[0]);
    const params = new URLSearchParams(encoded.split('?')[1] || '');
    const playVideoParam = params.get('play');
    showView('course');
    loadCourseDetail(coursePath, playVideoParam);
  } else if (hash.startsWith('#/courses')) {
    showView('courses');
    document.querySelector('[data-nav="courses"]').classList.add('active');
    loadCoursesGrid('courses-grid');
  } else if (hash.startsWith('#/in-progress')) {
    showView('in-progress');
    document.querySelector('[data-nav="in-progress"]').classList.add('active');
    loadInProgressPage();
  } else if (hash.startsWith('#/completed')) {
    showView('completed');
    document.querySelector('[data-nav="completed"]').classList.add('active');
    loadCompletedPage();
  } else if (hash.startsWith('#/admin')) {
    if (userRole !== 'admin') { navigate('#/home'); return; }
    showView('admin');
    document.querySelector('[data-nav="admin"]').classList.add('active');
    loadUsers();
  } else {
    showView('home');
    document.querySelector('[data-nav="home"]').classList.add('active');
    loadHome();
  }
}

window.addEventListener('hashchange', router);

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!u || !p) { err.textContent = 'Remplissez les deux champs'; return; }
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    if (!r.ok) {
      const d = await r.json();
      err.textContent = d.error || 'Erreur de connexion';
      return;
    }
    const data = await r.json();
    token = data.token;
    username = data.username;
    userRole = data.role;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
    localStorage.setItem('userRole', userRole);
    setupNavbar();
    if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/') {
      navigate('#/home');
    } else {
      router();
    }
  } catch { err.textContent = 'Erreur réseau'; }
}

document.getElementById('btn-logout').onclick = () => {
  saveProgress();
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  localStorage.removeItem('userRole');
  location.reload();
};

function setupNavbar() {
  document.getElementById('nav-username').textContent = username || '';
  const adminLink = document.getElementById('nav-admin');
  if (userRole === 'admin') {
    adminLink.style.display = 'inline-block';
    document.getElementById('nav-username').innerHTML = `${escapeHtml(username)} <span class="role-badge">ADMIN</span>`;
  }
  document.getElementById('home-username').textContent = username || '';
}

// ============ CARTE DE COURS (agrégée) ============
function renderCourseProgressCard(c, opts = {}) {
  const el = document.createElement('div');
  el.className = 'card';
  const playIcon = opts.done ? '<div class="card-play done">✓</div>' :
                   opts.resume ? '<div class="card-play">▶</div>' : '';
  const percentLabel = opts.done ? '100% · Terminé' :
                       opts.resume ? `${c.percent}% · Reprendre` :
                       `${c.percent}%`;
  el.innerHTML = `
    ${playIcon}
    <div class="card-title">${escapeHtml(c.name)}</div>
    <div class="card-meta">${c.completed} / ${c.videoCount} leçons</div>
    <div class="card-bar"><div style="width:${c.percent}%${opts.done ? ';background:#4ade80' : ''}"></div></div>
    <div class="card-percent">
      <span>${percentLabel}</span>
      ${c.percent < 100 && c.percent > 0 ? `<span class="lessons-done">${c.videoCount - c.completed} restantes</span>` : ''}
    </div>
  `;
  el.onclick = () => {
    const url = '#/course/' + encodeURIComponent(c.path) + (c.lastVideoPath ? '?play=' + encodeURIComponent(c.lastVideoPath) : '');
    navigate(url);
  };
  return el;
}

async function loadHome() {
  // Reprendre
  try {
    const r = await fetch('/api/resume', { headers: { Authorization: 'Bearer ' + token } });
    const resume = await r.json();
    const grid = document.getElementById('home-resume-grid');
    grid.innerHTML = '';
    if (resume.length === 0) {
      grid.innerHTML = '<div class="empty">Aucun cours en cours. Lancez une vidéo pour la voir ici.</div>';
    } else {
      resume.forEach(c => grid.appendChild(renderCourseProgressCard(c, { resume: true })));
    }
  } catch {
    document.getElementById('home-resume-grid').innerHTML = '<div class="empty">Erreur de chargement</div>';
  }

  // Cours terminés (limité)
  await loadCompletedLimited();

  // Mes cours
  loadCoursesGrid('home-courses-grid');
}

async function loadCompletedLimited() {
  const grid = document.getElementById('home-completed-grid');
  const action = document.getElementById('home-completed-action');
  try {
    const r = await fetch('/api/completed', { headers: { Authorization: 'Bearer ' + token } });
    const all = await r.json();
    grid.innerHTML = '';
    action.innerHTML = '';
    if (all.length === 0) {
      grid.innerHTML = '<div class="empty">Aucun cours terminé. Complétez un cours pour le voir ici.</div>';
      return;
    }
    const limited = all.slice(0, HOME_COMPLETED_LIMIT);
    limited.forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: true })));
    if (all.length > HOME_COMPLETED_LIMIT) {
      const btn = document.createElement('button');
      btn.className = 'section-action';
      btn.textContent = `Voir les ${all.length} terminés →`;
      btn.onclick = () => navigate('#/completed');
      action.appendChild(btn);
    } else {
      const count = document.createElement('span');
      count.className = 'section-count';
      count.textContent = `(${all.length})`;
      action.appendChild(count);
    }
  } catch {
    grid.innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
}

async function loadCompletedPage() {
  const grid = document.getElementById('completed-grid');
  const counter = document.getElementById('completed-count');
  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/completed', { headers: { Authorization: 'Bearer ' + token } });
    const rows = await r.json();
    grid.innerHTML = '';
    if (rows.length === 0) {
      counter.textContent = '';
      grid.innerHTML = '<div class="empty">Aucun cours terminé.</div>';
      return;
    }
    counter.textContent = `(${rows.length})`;
    rows.forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: true })));
  } catch {
    grid.innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
}

async function loadInProgressPage() {
  const grid = document.getElementById('in-progress-grid');
  const counter = document.getElementById('in-progress-count');
  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/in-progress', { headers: { Authorization: 'Bearer ' + token } });
    const rows = await r.json();
    grid.innerHTML = '';
    if (rows.length === 0) {
      counter.textContent = '';
      grid.innerHTML = '<div class="empty">Aucun cours en cours.</div>';
      return;
    }
    counter.textContent = `(${rows.length})`;
    rows.forEach(c => grid.appendChild(renderCourseProgressCard(c, { resume: true })));
  } catch {
    grid.innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
}

async function loadCoursesGrid(targetId) {
  const grid = document.getElementById(targetId);
  grid.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/courses/top', { headers: { Authorization: 'Bearer ' + token } });
    const courses = await r.json();
    grid.innerHTML = '';
    if (!courses.length) {
      grid.innerHTML = '<div class="empty">Aucun cours trouvé.<br>Vérifiez le montage Yandex.</div>';
      return;
    }
    courses.forEach(c => grid.appendChild(renderCourseProgressCard(c, { done: c.isFullyDone })));
  } catch {
    grid.innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
}

async function loadCourseDetail(coursePath, autoPlayVideo) {
  currentCoursePath = coursePath;
  document.getElementById('course-title').textContent = coursePath.split('/').pop();
  const lessons = document.getElementById('course-lessons');
  lessons.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/courses/detail/' + encodeURIComponent(coursePath), {
      headers: { Authorization: 'Bearer ' + token }
    });
    const items = await r.json();
    lessons.innerHTML = '';
    if (!items.length) { lessons.innerHTML = '<div class="empty">Aucune leçon dans ce cours.</div>'; return; }
    renderLessons(items, lessons);
    if (autoPlayVideo) {
      const allVideos = [];
      collectVideos(items, allVideos);
      const target = allVideos.find(v => v.path === autoPlayVideo);
      if (target) playVideo(target);
    }
  } catch {
    lessons.innerHTML = '<div class="empty">Erreur de chargement</div>';
  }
}

function collectVideos(items, out) {
  for (const it of items) {
    if (it.type === 'folder') collectVideos(it.children, out);
    else out.push(it);
  }
}

function countVideos(items) {
  let n = 0;
  for (const it of items) {
    if (it.type === 'folder') n += countVideos(it.children);
    else n++;
  }
  return n;
}

function renderLessons(items, container) {
  for (const item of items) {
    if (item.type === 'folder') {
      const wrapper = document.createElement('div');
      wrapper.className = 'folder-wrapper';
      const count = countVideos(item.children);
      const header = document.createElement('div');
      header.className = 'folder-header';
      header.innerHTML = `
        <span class="folder-chevron">▶</span>
        <span class="folder-name">${escapeHtml(item.name)}</span>
        <span class="folder-count">${count}</span>
      `;
      const children = document.createElement('div');
      children.className = 'folder-children collapsed';
      header.onclick = () => {
        const isOpen = header.classList.toggle('open');
        children.classList.toggle('collapsed', !isOpen);
      };
      wrapper.appendChild(header);
      wrapper.appendChild(children);
      container.appendChild(wrapper);
      renderLessons(item.children, children);
    } else {
      const el = document.createElement('div');
      el.className = 'lesson';
      el.dataset.path = item.path;
      const ccBadge = item.subtitles && item.subtitles.length
        ? `<span class="cc-badge">CC ${item.subtitles.length}</span>` : '';
      el.innerHTML = `<div class="title-row"><span class="name">▶ ${escapeHtml(item.name)}</span>${ccBadge}</div>`;
      el.onclick = () => playVideo(item);
      container.appendChild(el);
    }
  }
}

function expandParentFolders(videoPath) {
  const lessonEl = document.querySelector(`.lesson[data-path="${cssEscape(videoPath)}"]`);
  if (!lessonEl) return;
  let el = lessonEl.parentElement;
  while (el) {
    if (el.classList && el.classList.contains('folder-children')) {
      el.classList.remove('collapsed');
      const header = el.previousElementSibling;
      if (header && header.classList.contains('folder-header')) {
        header.classList.add('open');
      }
    }
    el = el.parentElement;
  }
}

async function playVideo(item) {
  const videoPath = item.path;
  const displayName = item.name;
  currentVideo = videoPath;
  currentVideoPath = videoPath;
  currentSubtitles = item.subtitles || [];

  document.querySelectorAll('.lesson').forEach(e => e.classList.remove('active'));
  document.querySelectorAll(`.lesson[data-path="${cssEscape(videoPath)}"]`).forEach(e => e.classList.add('active'));

  expandParentFolders(videoPath);

  infoText.textContent = '⏳ Chargement…';
  resumeToast.style.display = 'none';
  archiveBtn.style.display = 'none';
  completeBtn.style.display = 'none';
  subtitleBtn.style.display = 'none';
  subtitleMenu.classList.remove('open');

  let progress = { position: 0, duration: 0, archived: 0, completed: 0 };
  try {
    const r = await fetch('/api/progress/' + encodeURIComponent(videoPath), {
      headers: { Authorization: 'Bearer ' + token }
    });
    progress = await r.json();
  } catch {}
  currentArchived = !!progress.archived;
  currentCompleted = !!progress.completed;

  player.querySelectorAll('track').forEach(t => t.remove());
  player.removeAttribute('src');
  player.load();

  currentSubtitles.forEach((sub, idx) => {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = formatLangLabel(sub.lang);
    track.srclang = sub.lang === 'default' ? 'fr' : sub.lang.slice(0, 3);
    track.src = '/api/subtitle/' + encodeURIComponent(sub.path) + '?token=' + encodeURIComponent(token);
    if (idx === 0) track.default = true;
    player.appendChild(track);
  });

  player.src = '/api/stream/' + encodeURIComponent(videoPath) + '?token=' + encodeURIComponent(token);
  player.load();

  player.onloadedmetadata = () => {
    if (progress.position > 5 && progress.position < player.duration - 5 && !currentCompleted) {
      player.currentTime = progress.position;
      resumeToast.textContent = '⏪ Reprise à ' + formatTime(progress.position);
      resumeToast.style.display = 'block';
      setTimeout(() => resumeToast.style.display = 'none', 3000);
    }
    infoText.textContent = displayName + ' — ' + formatTime(player.duration);
    archiveBtn.style.display = 'inline-block';
    completeBtn.style.display = 'inline-block';
    updateArchiveBtn();
    updateCompleteBtn();

    if (currentSubtitles.length > 0) {
      subtitleBtn.style.display = 'inline-block';
      buildSubtitleMenu();
      const savedLang = localStorage.getItem('subtitle_' + videoPath);
      setTimeout(() => {
        if (savedLang === 'off') setSubtitleMode('off');
        else if (savedLang) {
          const idx = currentSubtitles.findIndex(s => s.lang === savedLang);
          if (idx >= 0) enableTrack(idx);
          else enableTrack(0);
        } else {
          enableTrack(0);
        }
      }, 100);
    }
  };

  player.onerror = () => { infoText.textContent = '❌ Erreur de lecture : ' + displayName; };
  player.play().catch(() => {});

  if (saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(() => saveProgress(), 10000);
}

function stopPlayer() {
  if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }
  try { player.pause(); } catch {}
}

function formatLangLabel(lang) {
  if (lang === 'default') return 'Par défaut';
  const labels = {
    fr:'Français', en:'Anglais', es:'Espagnol', de:'Allemand', it:'Italien',
    pt:'Portugais', ru:'Russe', ar:'Arabe', zh:'Chinois', ja:'Japonais', ko:'Coréen',
    nl:'Néerlandais', pl:'Polonais', tr:'Turc', sv:'Suédois', no:'Norvégien',
    da:'Danois', fi:'Finnois', cs:'Tchèque', el:'Grec', he:'Hébreu',
    hu:'Hongrois', ro:'Roumain', uk:'Ukrainien', vi:'Vietnamien', th:'Thaï',
    id:'Indonésien', hi:'Hindi', bg:'Bulgare', hr:'Croate', sr:'Serbe',
    sk:'Slovaque', sl:'Slovène', lt:'Lituanien', lv:'Letton', et:'Estonien',
    fa:'Persan'
  };
  return labels[lang] || lang.toUpperCase();
}

function enableTrack(idx) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) {
    tracks[i].mode = (i === idx) ? 'showing' : 'disabled';
  }
  const lang = currentSubtitles[idx] ? currentSubtitles[idx].lang : 'default';
  localStorage.setItem('subtitle_' + currentVideoPath, lang);
  updateSubtitleMenuSelection(idx);
}

function setSubtitleMode(mode) {
  const tracks = player.textTracks;
  for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'disabled';
  if (mode === 'off') {
    localStorage.setItem('subtitle_' + currentVideoPath, 'off');
    updateSubtitleMenuSelection(-1);
  }
}

function buildSubtitleMenu() {
  subtitleMenu.innerHTML = '<div class="header">Sous-titres</div>';
  currentSubtitles.forEach((sub, idx) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.dataset.idx = idx;
    item.textContent = formatLangLabel(sub.lang);
    item.onclick = () => { enableTrack(idx); subtitleMenu.classList.remove('open'); };
    subtitleMenu.appendChild(item);
  });
  const offItem = document.createElement('div');
  offItem.className = 'item';
  offItem.dataset.idx = '-1';
  offItem.textContent = '❌ Désactivés';
  offItem.onclick = () => { setSubtitleMode('off'); subtitleMenu.classList.remove('open'); };
  subtitleMenu.appendChild(offItem);
}

function updateSubtitleMenuSelection(idx) {
  subtitleMenu.querySelectorAll('.item').forEach(item => {
    item.classList.toggle('selected', parseInt(item.dataset.idx) === idx);
  });
}

subtitleBtn.onclick = (e) => { e.stopPropagation(); subtitleMenu.classList.toggle('open'); };
document.addEventListener('click', (e) => {
  if (!subtitleMenu.contains(e.target) && e.target !== subtitleBtn) subtitleMenu.classList.remove('open');
});

function updateArchiveBtn() {
  archiveBtn.textContent = currentArchived ? 'Désarchiver' : 'Archiver';
  archiveBtn.onclick = async () => {
    await toggleArchive(currentVideo, !currentArchived);
    currentArchived = !currentArchived;
    updateArchiveBtn();
  };
}

function updateCompleteBtn() {
  completeBtn.textContent = currentCompleted ? '↺ Non terminé' : '✅ Marquer terminé';
  completeBtn.style.background = currentCompleted ? '#4ade80' : '';
  completeBtn.style.color = currentCompleted ? '#000' : '';
  completeBtn.onclick = async () => {
    await markCompleted(currentVideo, !currentCompleted);
    currentCompleted = !currentCompleted;
    updateCompleteBtn();
  };
}

async function markCompleted(videoPath, completed) {
  if (!player.duration) return;
  const position = completed ? player.duration : 0;
  await fetch('/api/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ video_path: videoPath, position, duration: player.duration })
  });
}

async function toggleArchive(videoPath, archive) {
  await fetch('/api/archive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ video_path: videoPath, archived: archive })
  });
}

async function saveProgress(useBeacon = false) {
  if (!currentVideo || !player.duration || player.currentTime < 1) return;
  const body = JSON.stringify({
    video_path: currentVideo,
    position: player.currentTime,
    duration: player.duration
  });
  if (useBeacon && navigator.sendBeacon) {
    navigator.sendBeacon('/api/progress?token=' + encodeURIComponent(token),
      new Blob([body], { type: 'application/json' }));
    return;
  }
  try {
    await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body
    });
  } catch {}
}

player.addEventListener('pause', () => saveProgress());
player.addEventListener('ended', saveProgress);
window.addEventListener('beforeunload', () => saveProgress(true));

document.getElementById('course-back').onclick = () => history.back();

document.getElementById('create-user-btn').onclick = async () => {
  const u = document.getElementById('new-username').value.trim();
  const p = document.getElementById('new-password').value;
  const role = document.getElementById('new-role').value;
  const err = document.getElementById('admin-error');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'Remplissez les champs'; return; }
  try {
    const r = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ username: u, password: p, role })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Erreur'; return; }
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-role').value = 'user';
    loadUsers();
  } catch { err.textContent = 'Erreur réseau'; }
};

async function loadUsers() {
  const list = document.getElementById('admin-user-list');
  list.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await fetch('/api/admin/users', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { list.innerHTML = '<div class="empty">Erreur</div>'; return; }
    const users = await r.json();
    list.innerHTML = '';
    if (!users.length) { list.innerHTML = '<div class="empty">Aucun utilisateur</div>'; return; }
    users.forEach(u => {
      const el = document.createElement('div');
      el.className = 'user-row';
      const badge = u.role === 'admin' ? '<span class="role-badge">ADMIN</span>' : '';
      const created = u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '—';
      el.innerHTML = `
        <div class="info">
          <div class="name">${escapeHtml(u.username)}${badge}</div>
          <div class="sub">Créé le ${created} · ${u.courses_started || 0} cours commencés</div>
        </div>
        <div class="actions">
          <button class="mini-btn" data-reset="${u.id}" data-name="${escapeHtml(u.username)}">🔑 Mot de passe</button>
          ${u.username !== username ? `<button class="mini-btn danger" data-del="${u.id}" data-name="${escapeHtml(u.username)}">🗑</button>` : ''}
        </div>
      `;
      list.appendChild(el);
    });
    list.querySelectorAll('[data-reset]').forEach(b => {
      b.onclick = () => resetPassword(parseInt(b.dataset.reset), b.dataset.name);
    });
    list.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => deleteUser(parseInt(b.dataset.del), b.dataset.name);
    });
  } catch { list.innerHTML = '<div class="empty">Erreur réseau</div>'; }
}

async function resetPassword(id, name) {
  const p = prompt(`Nouveau mot de passe pour "${name}" (min 6) :`);
  if (!p) return;
  if (p.length < 6) { alert('Trop court'); return; }
  const r = await fetch(`/api/admin/users/${id}/password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ password: p })
  });
  alert(r.ok ? 'Mot de passe réinitialisé.' : 'Erreur.');
}

async function deleteUser(id, name) {
  if (!confirm(`Supprimer "${name}" et toute sa progression ?`)) return;
  const r = await fetch(`/api/admin/users/${id}`, {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + token }
  });
  if (r.ok) loadUsers();
  else alert('Erreur lors de la suppression.');
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0s';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function cssEscape(s) { return s.replace(/["\\]/g, '\\$&'); }

if (token) {
  setupNavbar();
  router();
} else {
  showView('login');
}
